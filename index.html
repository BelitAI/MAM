<!DOCTYPE html>
<html lang="es">

<head>

    <link rel="icon" type="image/png" href="./assets/img/logo_favicon.png">

    <link rel="stylesheet" href="./css/style.css">

    <!-- Biblioteca p5.js -->

<body>

    <header>

            <img class="logo" src="./assets/img/logo_favicon.png" alt="MAN - Museo de Arte Mutable">
